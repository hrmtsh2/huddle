<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>huddle - tab groups manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <div class="container">
      <div class="header-row">
        <h1>huddle</h1>
        <a href="../welcome.html" target="_blank" class="help-link" title="help & tips">help</a>
      </div>

      <section class="section">
        <h2 class="collapsible-header" data-target="quickActions">
          quick actions
          <span class="collapse-icon">▼</span>
        </h2>
        <div id="quickActions" class="groups-list collapsible-content">
          <div class="quick-actions-grid">
            <button id="addAllCurrentWindow" class="btn primary">group all (window)</button>
            <button id="groupByDomain" class="btn primary">group by site</button>
            <button id="deduplicateTabs" class="btn primary">remove duplicates</button>
            <button id="suspendTabs" class="btn primary">suspend inactive</button>
          </div>
        </div>
      </section>

      <section class="section collapsible">
        <h2 class="collapsible-header" data-target="selectTabs">
          select tabs <span id="selectionCount" class="selection-count">(0 selected)</span>
          <span class="collapse-icon">▼</span>
        </h2>
        <div id="selectTabs" class="groups-list collapsible-content">
          <div class="search-box">
            <input type="text" id="tabSearch" placeholder="search tabs by content/title/url">
            <button id="clearSearch" class="clear-search-btn" title="clear search">✕</button>
          </div>

          <div class="selection-controls">
            <button id="selectAll" class="btn-small">select all</button>
            <button id="selectNone" class="btn-small">select none</button>
            <button id="selectCurrentWindow" class="btn-small">current window</button>
            <button id="selectFiltered" class="btn-small">select filtered</button>
          </div>
          <div id="tabsList" class="tabs-list">
            <p class="empty-message">loading tabs...</p>
          </div>
      </section>

      <section class="section collapsible">
        <h2 class="collapsible-header" data-target="actionsForSelectedTabs">
          actions for selected tabs
          <span class="collapse-icon">▼</span>
        </h2>
        <div id="actionsForSelectedTabs" class="groups-list collapsible-content">
          <div class="form-group">
            <input type="text" id="newGroupName" placeholder="new group name">
            <select id="groupColour">
              <option value="blue">blue</option>
              <option value="red">red</option>
              <option value="yellow">yellow</option>
              <option value="green">green</option>
              <option value="pink">pink</option>
              <option value="purple">purple</option>
              <option value="cyan">cyan</option>
              <option value="orange">orange</option>
              <option value="grey">grey</option>
            </select>
          </div>
          <button id="addToNewGroup" class="btn primary">add to new group</button>

          <div class="divider">
            <span>or add to existing group</span>
          </div>

          <select id="existingGroupSelect">
            <option value="">select an open group...</option>
          </select>
          <button id="addToExistingGroup" class="btn secondary">add to open group</button>

          <div class="divider">
            <span>or manage selected tabs</span>
          </div>

          <div class="action-buttons-grid">
            <button id="suspendSelectedTabs" class="btn outline">suspend</button>
            <button id="removeFromGroup" class="btn outline">ungroup</button>
            <button id="closeSelectedTabs" class="btn outline">close</button>
          </div>
        </div>
      </section>

      <section class="section collapsible">
        <h2 class="collapsible-header" data-target="searchTabContent">
          search tab content
          <span class="collapse-icon">▼</span>
        </h2>
        <div id="searchTabContent" class="groups-list collapsible-content">
          <div class="content-search-box">
            <div class="content-search-input-row">
              <input type="text" id="contentSearchInput" placeholder="search text content in tabs...">
              <button id="contentSearchBtn" class="btn primary btn-icon" title="search"><img src="../icons/search-interface-symbol.png" alt="search" class="btn-icon-img"></button>
            </div>
            <div class="content-search-controls">
              <select id="searchGroupFilter">
                <option value="">all groups</option>
              </select>
              <span id="indexStats" class="index-stats"></span>
            </div>
          </div>
          <div id="contentSearchResults" class="content-search-results hidden">
          </div>
        </div>
      </section>

      <section class="section collapsible">
        <h2 class="collapsible-header" data-target="activeGroups">
          active tab groups <span id="groupSelectionCount" class="selection-count">(0 selected)</span>
          <span class="collapse-icon">▼</span>
        </h2>
        <div id="activeGroups" class="groups-list collapsible-content">
          <div class="selection-controls" id="groupSelectionControls" style="display: none;">
            <button id="mergeSelectedGroups" class="btn-small">merge selected</button>
            <button id="clearGroupSelection" class="btn-small">clear selection</button>
          </div>
          <div id="activeGroupsList">
            <p class="empty-message">loading...</p>
          </div>
        </div>
      </section>

      <div id="statusMessage" class="status-message hidden"></div>
    </div>

    <script src="content-store.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
